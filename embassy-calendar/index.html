<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Embassy Holiday & Duty Calendar | Embassy of Belgium</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Belgian Flag Top Stripe -->
    <div class="flag-banner">
        <div class="stripe black"></div>
        <div class="stripe yellow"></div>
        <div class="stripe red"></div>
    </div>

    <!-- Navigation Header -->
    <div class="top-nav">
        <a href="../index.html" class="back-btn">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            Back to Main Portal
        </a>
        <div style="display: flex; gap: 10px;">
            <button id="export-word-btn" class="export-btn" style="background-color: #2b579a;">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                Download Word!
            </button>
            <button id="export-btn" class="export-btn">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
            Download PDF Poster
        </button>
        </div>
    </div>

    <!-- Application Workspace Grid -->
    <div class="app-container">

        <!-- Controls Sidebar -->
        <aside class="controls-panel">
            <div class="controls-title">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                Calendar Settings
            </div>

            <div class="form-group">
                <label for="year-select">Select Year</label>
                <select id="year-select" class="form-select">
                    <option value="2026" selected>2026</option>
                    <option value="2027">2027</option>
                </select>
            </div>

            <div class="form-group">
                <label for="month-select">Display Mode</label>
                <select id="month-select" class="form-select">
                    <option value="0" selected>Full Year Poster (12 Months)</option>
                </select>
            </div>

            <div class="form-group">
                <label>Event Categories</label>
                <div class="filter-checks">
                    <label class="check-label">
                        <input type="checkbox" id="check-academic" checked>
                        <span>🎓 Academic & Public Diplomacy</span>
                    </label>
                    <label class="check-label">
                        <input type="checkbox" id="check-economic" checked>
                        <span>💼 Economic & Maritime Cooperation</span>
                    </label>
                    <label class="check-label">
                        <input type="checkbox" id="check-democracy" checked>
                        <span>⚖️ Democracy, Human Rights</span>
                    </label>
                    <label class="check-label">
                        <input type="checkbox" id="check-visits" checked>
                        <span>🤝 Visits & Missions</span>
                    </label>
                    <label class="check-label">
                        <input type="checkbox" id="check-belgian-days" checked>
                        <span>🎉 Belgian Days</span>
                    </label>
                </div>
            </div>

            <hr style="border: none; border-top: 1px solid var(--border-color); margin: 1.5rem 0;">

            <a href="https://docs.google.com/spreadsheets/d/13NB7O9q81_vHM73p9rTyTQC5lTi3IPIYh_FJQhXZ35g/edit?gid=0#gid=0" target="_blank" class="export-btn" style="width: 100%; justify-content: center; background-color: #0f9d58; margin-bottom: 10px; text-decoration: none;">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                Edit Data in Sheets
            </a>
        </aside>

        <!-- Printable Canvas Container -->
        <main style="overflow-x: auto;">
            <div id="poster-canvas">
                <div id="poster-content">
                    <!-- Dynamic Calendar generated by calendar.js -->
                </div>
            </div>
        </main>

    </div>

    <!-- Modal for viewing events -->
    <div id="modal-overlay" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-header" id="modal-main-header">Events</div>
            <div id="modal-existing-events" style="margin-bottom: 1.25rem;"></div>
            <div style="display: flex; justify-content: flex-end; margin-top: 1.5rem;">
                <button id="modal-close" style="padding: 8px 16px; background: var(--belgium-black); color: white; border: none; border-radius: 6px; cursor: pointer;">Close</button>
            </div>
        </div>
    </div>

    <!-- html2canvas and jsPDF for PDF Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <!-- PapaParse for CSV processing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <!-- Local Application Scripts -->
    <script src="holidays.js"></script>
    <script src="calendar.js"></script>
</body>
</html>
