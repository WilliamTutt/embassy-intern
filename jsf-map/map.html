<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSF 2027-2031 | Belgian Partnerships (D3 Vector Map)</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gray-50">

    <!-- Print/Export Button moved OUTSIDE the poster canvas -->
    <!-- Print/Export and Back Buttons moved OUTSIDE the poster canvas -->
    <div style="text-align: center; margin: 20px 0; display: flex; justify-content: center; gap: 10px;">
        <a href="../index.html" style="text-decoration: none; background-color: #ef4444; color: white; border: none; padding: 12px 24px; font-size: 1rem; border-radius: 6px; cursor: pointer; font-family: 'Inter', sans-serif;">Back to Main</a>
        <button id="print-btn" style="background-color: #0f172a; color: white; border: none; padding: 12px 24px; font-size: 1rem; border-radius: 6px; cursor: pointer; font-family: 'Inter', sans-serif;">Export / Print Portrait Poster</button>
    </div>

    <div id="poster-canvas">
        <!-- Floating Title for the Poster -->
        <div id="poster-header">
            <div class="belgian-banner">
                <div class="stripe black"></div>
                <div class="stripe yellow"></div>
                <div class="stripe red"></div>
            </div>
            <div class="header-content">
                <h1>JSF 2027-2031 | Philippines Partnerships</h1>
                <p>Geographical Distribution of Belgian NGOs & Local Partners</p>
            </div>
        </div>

        <!-- HTML Overlays for Callouts (Avoids SVG foreignObject bugs) -->
        <div id="left-sidebar" class="sidebar-layout"></div>
        <div id="right-sidebar" class="sidebar-layout"></div>

        <!-- Fullscreen Map Canvas -->
        <div id="map-container">
            <!-- D3 will inject the SVG here -->
        </div>
    </div>

    <!-- D3.js -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <!-- html2canvas and jsPDF for printing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <!-- Local JS files -->
    <script src="data.js"></script>
    <script src="provinces.js"></script>
    <script src="script.js"></script>
</body>
</html>
